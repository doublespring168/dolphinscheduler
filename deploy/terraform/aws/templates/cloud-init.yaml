#cloud-config

groups:
  - ds

users:
  - name: ds
    shell: /bin/bash
    primary_group: ds
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}
  - name: root
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/systemd/system/gyyun-schema.service
    content: |
      [Unit]
      Description=DolphinScheduler service to init database schema

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      Environment="DATABASE=postgresql"
      Environment="SPRING_PROFILES_ACTIVE=postgresql"
      Environment="SPRING_DATASOURCE_URL=jdbc:postgresql://${database_address}:${database_port}/${database_name}"
      Environment="SPRING_DATASOURCE_USERNAME=${database_username}"
      Environment="SPRING_DATASOURCE_PASSWORD=${database_password}"
      User=ds
      WorkingDirectory=/opt/gyyun
      ExecStart=bash -l /opt/gyyun/tools/bin/upgrade-schema.sh

      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/gyyun.service
    content: |
      [Unit]
      Description=DolphinScheduler Service ${gyyun_component}
      Requires=gyyun-schema.service

      [Service]
      Environment="DATABASE=postgresql"
      Environment="SPRING_PROFILES_ACTIVE=postgresql"
      Environment="SPRING_DATASOURCE_URL=jdbc:postgresql://${database_address}:${database_port}/${database_name}"
      Environment="SPRING_DATASOURCE_USERNAME=${database_username}"
      Environment="SPRING_DATASOURCE_PASSWORD=${database_password}"
      Environment="REGISTRY_ZOOKEEPER_CONNECT_STRING=${zookeeper_connect_string}"
      Environment="WORKER_ALERT_LISTEN_HOST=${alert_server_host}"
      User=ds
      WorkingDirectory=/opt/gyyun
      ExecStart=bash -l /opt/gyyun/${gyyun_component}/bin/start.sh
      Restart=always

      [Install]
      WantedBy=multi-user.target

packages: []

runcmd:
  - chown -R ds:ds /opt/gyyun
  - find /opt/gyyun/ -name "start.sh" | xargs -I{} chmod +x {}
  - find /opt/gyyun/ -name "common.properties" | xargs -I{} sed -ie "s/^resource.storage.type=.*/resource.storage.type=S3/g" {}
  - find /opt/gyyun/ -name "common.properties" | xargs -I{} sed -ie "s/^resource.aws.access.key.id=.*/resource.aws.access.key.id=${s3_access_key_id}/g" {}
  - find /opt/gyyun/ -name "common.properties" | xargs -I{} sed -ie "s:^resource.aws.secret.access.key=.*:resource.aws.secret.access.key=${s3_secret_access_key}:g" {}
  - find /opt/gyyun/ -name "common.properties" | xargs -I{} sed -ie "s/^resource.aws.region=.*/resource.aws.region=${s3_region}/g" {}
  - find /opt/gyyun/ -name "common.properties" | xargs -I{} sed -ie "s/^resource.aws.s3.bucket.name=.*/resource.aws.s3.bucket.name=${s3_bucket_name}/g" {}
  - find /opt/gyyun/ -name "common.properties" | xargs -I{} sed -ie "s/^resource.aws.s3.endpoint=.*/resource.aws.s3.endpoint=${s3_endpoint}/g" {}
  - systemctl enable gyyun
  - systemctl start gyyun-schema
  - systemctl start gyyun
